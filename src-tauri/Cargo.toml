[package]
name = "winsta"
version = "0.1.0"
license = "GPL-3.0-only"
authors = ["Savoreux"]
description = "Winsta — pengelola aplikasi Windows di atas winget"
edition = "2021"

[lib]
name = "winsta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
