# Membuat installer .msi dan merilisnya di GitHub setiap kali tag versi (v0.1.0, v0.2.0, …) di-push.
# Tampilan (folder dist) sudah ikut di-commit, jadi workflow ini hanya butuh Rust.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek versi tag sama dengan tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($conf.version -ne $tag) {
            Write-Error "Tag v$tag tidak sama dengan versi di tauri.conf.json ($($conf.version)). Samakan dulu."
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build installer .msi
        run: npx --yes @tauri-apps/cli@2 build --bundles msi

      - name: Hitung SHA-256
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi
          $msi | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii src-tauri/target/release/bundle/msi/SHA256SUMS.txt

      - name: Unggah ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/SHA256SUMS.txt
